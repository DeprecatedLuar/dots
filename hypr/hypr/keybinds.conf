$mainMod = SUPER # Sets "Windows" key as main modifier

#──[Launchers]-------------------------------------------------------------

bind = $mainMod, Return, exec, $TERMINAL
bind = $mainMod, F, exec, $FILEMANAGER
bind = $mainMod, B, exec, $BROWSER
bind = $mainMod SHIFT, B, exec, brave
bind = $mainMod, E, exec, thunderbird
bind = $mainMod, W, exec, flatpak run com.rtosta.zapzap
bind = $mainMod, V, exec, copyq toggle

# Tap-and-release SUPER alone
bindr = $mainMod, SUPER_L, exec, hotline

#──[Window Management]-----------------------------------------------------

# Window controls
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, M, fullscreen, toggle
bind = , F11, fullscreenstate, 0 2
bind = $mainMod, Z, togglefloating,
bind = $mainMod, X, exec, hyprctl -i 0 kill
#bind = $mainMod, P, pseudo, # dwindle

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows (left/right disabled - conflicts with hyprscrolling swapcol)
#bind = $mainMod, O, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod, I, movewindow, l
bind = $mainMod ALT, right, exec, ~/.config/hypr/scripts/move-to-monitor.sh next
bind = $mainMod ALT, left, exec, ~/.config/hypr/scripts/move-to-monitor.sh prev

# Resize windows (disabled - using hyprscrolling colresize instead)
#bind = $mainMod CTRL, left, resizeactive, -100 0
bind = $mainMod CTRL, up, resizeactive, 0 70
bind = $mainMod CTRL, down, resizeactive, 0 -70
#bind = $mainMod CTRL, right, resizeactive, 100 0

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#──[Workspaces]------------------------------------------------------------

# Switch workspaces (per-monitor via hyprsplit)
bind = $mainMod, 1, split:workspace, 1
bind = $mainMod, 2, split:workspace, 2
bind = $mainMod, 3, split:workspace, 3
bind = $mainMod, 4, split:workspace, 4
bind = $mainMod, 5, split:workspace, 5
bind = $mainMod, 6, split:workspace, 6
bind = $mainMod, 7, split:workspace, 7
bind = $mainMod, 8, split:workspace, 8
bind = $mainMod, 9, split:workspace, 9
bind = $mainMod, 0, split:workspace, 10

# Move windows to workspaces (per-monitor via hyprsplit)
bind = $mainMod SHIFT, 1, split:movetoworkspace, 1
bind = $mainMod SHIFT, 2, split:movetoworkspace, 2
bind = $mainMod SHIFT, 3, split:movetoworkspace, 3
bind = $mainMod SHIFT, 4, split:movetoworkspace, 4
bind = $mainMod SHIFT, 5, split:movetoworkspace, 5
bind = $mainMod SHIFT, 6, split:movetoworkspace, 6
bind = $mainMod SHIFT, 7, split:movetoworkspace, 7
bind = $mainMod SHIFT, 8, split:movetoworkspace, 8
bind = $mainMod SHIFT, 9, split:movetoworkspace, 9
bind = $mainMod SHIFT, 0, split:movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special workspace (scratchpad)
bind = $mainMod, space, togglespecialworkspace, magic
bind = $mainMod SHIFT, space, movetoworkspace, special:magic

#──[Media Keys]------------------------------------------------------------

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Microphone
bindl  = CTRL, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = CTRL, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%+
bindel = CTRL, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-

# Brightness / gamma
bindel = , XF86MonBrightnessUp, exec, sunset +5
bindel = , XF86MonBrightnessDown, exec, sunset -5
bindel = CTRL, XF86MonBrightnessUp, exec, sunset temp -250
bindel = CTRL, XF86MonBrightnessDown, exec, sunset temp +250

# Media playback
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Push-to-mute passthrough for meeting apps
bind = SHIFT, XF86AudioMute, sendshortcut, CTRL SHIFT, M,

#──[Mouse Emulation]-------------------------------------------------------

# Coarse pointer jumps
bind = ALT, H, exec, ydotool mousemove -x -200 -y 0
bind = ALT, J, exec, ydotool mousemove -x 0 -y 200
bind = ALT, K, exec, ydotool mousemove -x 0 -y -200
bind = ALT, L, exec, ydotool mousemove -x 200 -y 0

# Fine pointer movement (repeats while held)
binde = ALT SHIFT, H, exec, ydotool mousemove -x -7 -y 0
binde = ALT SHIFT, J, exec, ydotool mousemove -x 0 -y 5
binde = ALT SHIFT, K, exec, ydotool mousemove -x 0 -y -5
binde = ALT SHIFT, L, exec, ydotool mousemove -x 7 -y 0

# Clicks
bind = ALT, F, exec, ydotool click 0xC0
bind = ALT, D, exec, ydotool click 0xC1

#──[Screenshots & Utils]---------------------------------------------------

bind = , Print, exec, grimblast -f -n copysave area ~/Media/screenshots/latest.png
bind = SHIFT, Print, exec, grimblast -f -n -o save area
bind = $mainMod, P, exec, grimblast copy area
bind = $mainMod CTRL, P, exec, grimblast -f -n copysave area
bind = $mainMod SHIFT, P, exec, $IMAGE_VIEWER ~/Media/screenshots/latest.png

bind = $mainMod, Y, exec, bash -c 'yap toggle & sleep 3 && tcpeek reconnect'
