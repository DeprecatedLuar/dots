set -g prefix C-b

# --- Bar colors ---
set -g @bar_bg_idle "black"
set -g @bar_bg_prefix "colour208"
set -g @bar_fg_idle "white"
set -g @bar_fg_prefix "black"
set -g @bar_fg_dim "colour245"

# Minimal status bar, 2 states: idle vs prefix-armed
set -g status on
set -g status-justify left
set -g status-left-length 150
set -g status-left "#{?client_prefix,#(~/.config/tmux/scripts/shortcuts.sh),#[fg=#{@bar_fg_idle}] [#S] }"
set -g status-right-length 150
set -g status-right "#{?client_prefix, d:exit ,#[fg=#{@bar_fg_idle}] #{pane_current_command} }"

set -g status-style "fg=#{?client_prefix,#{@bar_fg_prefix},#{@bar_fg_idle}},bg=#{?client_prefix,#{@bar_bg_prefix},#{@bar_bg_idle}}"
set -g window-status-format ""
set -g window-status-current-format ""

# Force an immediate status-line refresh (re-running #() commands) the
# instant prefix is pressed, instead of waiting on status-interval.
bind -n C-b run-shell "tmux refresh-client -S" \; send-prefix

# Mouse on (hold Shift for native terminal selection)
set -g mouse on

set -g history-limit 50000
set -g alternate-screen off

source-file ~/.config/tmux/keybindings.conf
