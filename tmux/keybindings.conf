unbind r
bind-key -N "reload config" r source-file ~/.config/tmux/tmux.conf

# Toggle mouse mode on/off
bind-key -N "toggle mouse" m if-shell -F '#{mouse}' 'set -g mouse off ; display-message "Mouse OFF"' 'set -g mouse on ; display-message "Mouse ON"'

bind-key -N "pane left" h select-pane -L
bind-key -N "pane down" j select-pane -D
bind-key -N "pane up" k select-pane -U
bind-key -N "pane right" l select-pane -R

# Splits: prefix + H (side-by-side), prefix + V (stacked)
bind-key -N "split horiz" H split-window -h
bind-key -N "split vert" V split-window -v
